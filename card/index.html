<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="text-scale" content="scale" />
  <title>Loyalty card — BAIA Cafe</title>
  <meta name="description" content="Collect coffee stamps and unlock free handcrafted specialty drinks at BAIA Café in San Pascual, Burias Island." />
  <meta name="theme-color" content="#F5E9D6" />
  <link rel="preconnect" href="https://cqtcmrqlafgtcrcfaojz.supabase.co" crossorigin />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preload" href="/fonts/Outfit-latin-QGYvz_MVcBeNP4NJtEtq.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/DynaPuff-Bold-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" as="image" href="/images/classiccafe-card.webp" fetchpriority="high" type="image/webp" />
  <link rel="stylesheet" href="/src/styles/loyalty.css" />

  <!-- Speculation Rules API for Instant Prefetch of Home Page (Preserves Cross-Document View Transitions) -->
  <script type="speculationrules">
  {
    "prefetch": [
      {
        "source": "list",
        "urls": ["/"],
        "eagerness": "immediate"
      }
    ]
  }
  </script>

  <!-- Cross-Document View Transitions & Shared Element Logo Motion -->
  <style>
    @font-face{font-family:'Outfit';font-style:normal;font-weight:400 900;font-display:swap;src:url('/fonts/Outfit-latin-QGYvz_MVcBeNP4NJtEtq.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:'DynaPuff';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/DynaPuff-Bold-latin.woff2') format('woff2')}
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :focus:not(:focus-visible) {
      outline: none !important;
      box-shadow: none !important;
    }
    html {
      scrollbar-gutter: stable;
    }
    html, body {
      font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #F5E9D6 !important;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --motion-duration-logo: 0.4s;
      --motion-duration-page: 0.32s;
      --motion-duration-fade: 0.2s;
      --motion-ease-logo: cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (max-width: 768px) {
      :root {
        --motion-duration-logo: 0.4s;
        --motion-duration-page: 0.32s;
        --motion-duration-fade: 0.2s;
        --motion-ease-logo: cubic-bezier(0.4, 0, 0.2, 1);
      }
    }
    @view-transition {
      navigation: auto;
    }
    ::view-transition {
      background-color: #F5E9D6;
    }
    ::view-transition-old(root) {
      animation: pageOldFadeOut var(--motion-duration-fade, 0.55s) cubic-bezier(0.4, 0, 0.2, 1) both !important;
      z-index: 1;
    }
    ::view-transition-new(root) {
      animation: pageNewSlideIn var(--motion-duration-page, 0.70s) cubic-bezier(0.4, 0, 0.2, 1) both !important;
      z-index: 2;
      mix-blend-mode: normal;
    }
    @keyframes pageOldFadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @keyframes pageNewSlideIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .loyalty-logo-img {
      view-transition-name: baia-brand-logo;
      contain: paint;
      transform: translateZ(0);
      will-change: transform;
    }
    ::view-transition-group(baia-brand-logo) {
      z-index: 999;
      animation-duration: var(--motion-duration-logo, 0.75s);
      animation-timing-function: var(--motion-ease-logo, cubic-bezier(0.4, 0, 0.2, 1));
    }
    ::view-transition-old(baia-brand-logo) {
      animation: logoFadeOut var(--motion-duration-logo, 0.75s) var(--motion-ease-logo, cubic-bezier(0.4, 0, 0.2, 1)) both;
      mix-blend-mode: normal !important;
    }
    ::view-transition-new(baia-brand-logo) {
      animation: logoFadeIn var(--motion-duration-logo, 0.75s) var(--motion-ease-logo, cubic-bezier(0.4, 0, 0.2, 1)) both;
      mix-blend-mode: normal !important;
    }
    @keyframes logoFadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @keyframes logoFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Initial Shell styling for seamless view transition & zero white flash */
    .loyalty-app-wrapper {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #F5E9D6;
      display: flex;
      flex-direction: column;
    }
    .loyalty-header {
      min-height: 77px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(22, 37, 92, 0.08);
      background: #F5E9D6;
    }
    .loyalty-logo-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .loyalty-logo-img {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(22, 37, 92, 0.18);
      transform: translateZ(0);
      will-change: transform;
    }
    .loyalty-logo-title-group {
      display: flex;
      flex-direction: column;
    }
    .loyalty-logo-title {
      font-family: 'DynaPuff', 'Outfit', system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 0.01em;
      color: #16255C;
      line-height: 1;
    }
    .loyalty-logo-sub {
      margin-top: 3px;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: #5A6987;
    }
    .btn-loyalty-signout {
      background: #FFFFFF;
      border: 1px solid #E7DDCB;
      color: #16255C;
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(14, 26, 69, 0.05);
      transition: all 0.2s ease;
    }
    .btn-loyalty-signout:hover {
      background: #16255C;
      color: #FFFFFF;
      border-color: #16255C;
      box-shadow: 0 4px 12px rgba(22, 37, 92, 0.15);
    }
    @keyframes spinShell {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loyalty-app-wrapper">
    <!-- Persistent header — outside React root for uninterrupted view transitions -->
    <header class="loyalty-header" id="loyalty-header-static">
      <a href="/" class="loyalty-logo-lockup" title="Return to BAIA Café">
        <img src="/images/Logo.webp" alt="BAIA Cafe Logo" class="loyalty-logo-img" width="44" height="44" />
        <div class="loyalty-logo-title-group">
          <div class="loyalty-logo-title">BAIA</div>
          <div class="loyalty-logo-sub">Loyalty card</div>
        </div>
      </a>
      <div id="loyalty-header-actions" style="display: flex; align-items: center; gap: 8px; min-height: 34px;"></div>
    </header>
    <div id="root" style="display: flex; flex-direction: column; flex: 1;">
      <!-- React renders below the static header -->
      <main class="loyalty-main-content" style="flex: 1; padding: 20px 16px;">
        <div style="text-align: center; padding: 60px 20px;">
          <div style="width: 38px; height: 38px; border: 3px solid rgba(22, 37, 92, 0.12); border-top-color: #16255C; border-radius: 50%; display: inline-block; animation: spinShell 0.8s linear infinite;"></div>
          <p style="color: #5A6987; margin-top: 16px; font-size: 0.9rem; font-family: 'Outfit', sans-serif;">Loading your loyalty card...</p>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/src/card/main.jsx"></script>
</body>
</html>
