<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A45"/>
      <stop offset="50%" stop-color="#16255C"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Surfboard Fill Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Wood Stringer Gradient -->
    <linearGradient id="stringerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Amber Glow -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#bgGrad)"/>
  <rect width="900" height="1200" fill="url(#blueprintGrid)"/>

  <!-- Blueprint Dimension Rings / Technical Circles -->
  <circle cx="450" cy="580" r="340" fill="none" stroke="rgba(245, 166, 35, 0.12)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="450" cy="580" r="260" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Horizontal Measurement Guide Lines -->
  <line x1="120" y1="220" x2="780" y2="220" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="580" x2="820" y2="580" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="120" y1="940" x2="780" y2="940" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Dimension Annotation Texts -->
  <text x="140" y="210" fill="rgba(255, 255, 255, 0.4)" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" letter-spacing="2">NOSE WIDTH: 18.5"</text>
  <text x="100" y="570" fill="#F5A623" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800" letter-spacing="2">MAX WIDTH: 23.0"</text>
  <text x="140" y="930" fill="rgba(255, 255, 255, 0.4)" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" letter-spacing="2">TAIL WIDTH: 15.0"</text>

  <!-- Surfboard Silhouette Shadow -->
  <path d="M 450 140
           C 490 200, 570 360, 580 580
           C 590 800, 530 960, 485 1040
           L 415 1040
           C 370 960, 310 800, 320 580
           C 330 360, 410 200, 450 140 Z"
        fill="rgba(0, 0, 0, 0.45)"
        transform="translate(14, 18)"/>

  <!-- Surfboard Body Outer Outline (EPS Core) -->
  <path d="M 450 140
           C 490 200, 570 360, 580 580
           C 590 800, 530 960, 485 1040
           L 415 1040
           C 370 960, 310 800, 320 580
           C 330 360, 410 200, 450 140 Z"
        fill="url(#boardGrad)"
        stroke="#FFFFFF"
        stroke-width="5"/>

  <!-- Modern BAIA Electric Blue Stripe Accent -->
  <path d="M 450 145
           C 475 220, 530 380, 540 580
           C 545 700, 520 840, 495 950
           L 475 950
           C 490 840, 510 700, 505 580
           C 498 380, 460 220, 450 145 Z"
        fill="#1E4AFF"
        opacity="0.9"/>

  <!-- Center Wood Stringer -->
  <rect x="447" y="142" width="6" height="896" rx="3" fill="url(#stringerGrad)"/>

  <!-- Fin Preview (Single Box + Stabilizer Outline) -->
  <path d="M 450 970 L 450 1025 L 438 1035 L 438 970 Z" fill="#D97706" opacity="0.8"/>
  <rect x="444" y="960" width="12" height="75" rx="3" fill="#1E293B" stroke="#F5A623" stroke-width="2"/>

  <!-- Brand Decal on Board -->
  <circle cx="450" cy="440" r="36" fill="#16255C" stroke="#F5A623" stroke-width="2.5"/>
  <text x="450" y="438" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">BAIA</text>
  <text x="450" y="454" fill="#FFE699" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="2">SHORE</text>

  <!-- Technical Specs Legend Box -->
  <g transform="translate(180, 1070)">
    <rect width="540" height="75" rx="14" fill="rgba(14, 26, 69, 0.85)" stroke="rgba(245, 166, 35, 0.4)" stroke-width="1.5"/>
    <text x="270" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">CLASSIC CRUISER 9'0" LONGBOARD</text>
    <text x="270" y="55" fill="#FFE699" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="3">EPS HIGH-BUOYANCY FOAM • SINGLE FIN + 2</text>
  </g>

  <!-- Coming Soon Stamp -->
  <g transform="translate(450, 720) rotate(-10)">
    <rect x="-160" y="-32" width="320" height="64" rx="32" fill="#78350F" stroke="#F5A623" stroke-width="3" filter="url(#amberGlow)"/>
    <text x="0" y="8" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="3">IN PRODUCTION</text>
  </g>
</svg>
